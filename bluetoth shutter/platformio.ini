; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
; PINNED ON PURPOSE -- do not float this.
; BleKeyboard.cpp does `#include <driver/adc.h>`, a legacy ESP-IDF ADC driver
; that was REMOVED in ESP-IDF 5.x. espressif32 6.11.0 ships Arduino core 2.0.17
; (IDF 4.4.7) where it still exists; 7.x ships core 3.x (IDF 5.x) where it does
; not, and the library will not compile. 6.11.0 is what is installed locally.
platform = espressif32@6.11.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

lib_deps =
    ; 0.3.2 is the newest release (Feb 2022). Pinned -- no version range.
    t-vk/ESP32 BLE Keyboard@0.3.2

; REQUIRED. nodemcu-32s.json has no partition override, so the framework's
; default.csv applies -- a 1280 KB app0 slot. Bluedroid + BLE HID overruns it
; ("Flash: 103.0% / Greater than maximum allowed (1310720 bytes)"). huge_app.csv
; gives a 3 MB app slot over the full 4 MB. Costs OTA, which we don't need.
;
; Change this BEFORE you pair anything: reshuffling the flash layout can erase
; NVS, which holds the BLE bond, leaving the phone with a stale bond.
board_build.partitions = huge_app.csv

build_flags =
    -D SHUTTER_BURST_COUNT=3      ; photos per button press
    -D SHUTTER_BURST_GAP_MS=400   ; gap between shots; below ~300ms Android coalesces them
    -D SHUTTER_SEND_ENTER=0       ; set to 1 if Vol+ alone is ignored by the camera app
    ; -D BTN_RETURN_PIN=-1        ; uncomment if you rewire the button to a real GND pin
